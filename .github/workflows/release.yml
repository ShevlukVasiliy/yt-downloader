name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release-macos:
    permissions:
      contents: write
    runs-on: macos-14 # Apple Silicon runner
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      # yt-dlp/ffmpeg/ffprobe aren't committed to the repo (large, platform-specific
      # binaries) — fetch fresh static builds here and bundle them as Tauri
      # resources, exactly like a local `tauri build` expects in src-tauri/binaries/.
      #
      # qjs (quickjs-ng) and bgutil-pot are pinned rather than "latest": yt-dlp
      # only needs a JS runtime/PO-token provider that satisfy its own version
      # floor, so there's no benefit to floating these, and a pin keeps builds
      # reproducible. Bump deliberately when needed.
      - name: Prepare bundled yt-dlp/ffmpeg/ffprobe/qjs/bgutil-pot
        run: |
          set -euo pipefail
          mkdir -p src-tauri/binaries
          cd src-tauri/binaries

          curl -fL --retry 3 -o yt-dlp https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos
          curl -fL --retry 3 -o ffmpeg.zip "https://evermeet.cx/ffmpeg/getrelease/ffmpeg/zip"
          curl -fL --retry 3 -o ffprobe.zip "https://evermeet.cx/ffmpeg/getrelease/ffprobe/zip"
          unzip -o ffmpeg.zip -x '*.txt' -d .
          unzip -o ffprobe.zip -x '*.txt' -d .
          rm -f ffmpeg.zip ffprobe.zip

          curl -fL --retry 3 -o qjs https://github.com/quickjs-ng/quickjs/releases/download/v0.16.2/qjs-darwin-arm64
          curl -fL --retry 3 -o bgutil-pot https://github.com/jim60105/bgutil-ytdlp-pot-provider-rs/releases/download/v0.8.1/bgutil-pot-macos-aarch64

          chmod +x yt-dlp ffmpeg ffprobe qjs bgutil-pot
          codesign --force -s - yt-dlp ffmpeg ffprobe qjs bgutil-pot

          ./yt-dlp --version
          ./ffmpeg -version | head -1
          ./ffprobe -version | head -1
          ./qjs --version
          ./bgutil-pot --version

      # The yt-dlp plugin that talks to bgutil-pot. Must land at
      # pot-plugin/bgutil/yt_dlp_plugins/... — yt-dlp's `--plugin-dirs X` lists
      # the entries inside X and checks each for a yt_dlp_plugins/ folder, so
      # X (passed as `pot-plugin`) needs `bgutil/` as an intermediate level.
      - name: Prepare PO-token provider plugin
        run: |
          set -euo pipefail
          mkdir -p src-tauri/pot-plugin/bgutil
          cd src-tauri/pot-plugin/bgutil
          curl -fL --retry 3 -o plugin.zip https://github.com/jim60105/bgutil-ytdlp-pot-provider-rs/releases/download/v0.8.1/bgutil-ytdlp-pot-provider-rs.zip
          unzip -o plugin.zip
          rm -f plugin.zip
          test -d yt_dlp_plugins/extractor

      # tauri-apps/tauri-action's macOS bundle_dmg.sh is known to fail intermittently
      # (AppleScript/Finder flakiness) even on a clean runner — retry the build a
      # couple of times before giving up, then upload the artifacts ourselves.
      - name: Build app + dmg (retrying flaky dmg bundler)
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm run tauri build; then
              exit 0
            fi
            echo "Build attempt $attempt failed, retrying..."
            rm -rf src-tauri/target/release/bundle/dmg
            sleep 5
          done
          echo "Build failed after 3 attempts"
          exit 1

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "YT Downloader ${{ github.ref_name }}"
          body: "Скачайте установщик для вашей ОС: `.dmg` (macOS, Apple Silicon), `.msi`/`.exe` (Windows), `.deb`/`.AppImage` (Linux)."
          draft: true
          prerelease: false
          files: src-tauri/target/release/bundle/dmg/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-windows:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Prepare bundled yt-dlp/ffmpeg/ffprobe/qjs/bgutil-pot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/binaries
          cd src-tauri/binaries

          curl -fL --retry 3 -o yt-dlp.exe https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe
          curl -fL --retry 3 -o ffmpeg.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
          unzip -q ffmpeg.zip -d extracted
          find extracted -iname ffmpeg.exe -exec cp {} ./ffmpeg.exe \;
          find extracted -iname ffprobe.exe -exec cp {} ./ffprobe.exe \;
          rm -rf extracted ffmpeg.zip

          curl -fL --retry 3 -o qjs.exe https://github.com/quickjs-ng/quickjs/releases/download/v0.16.2/qjs-windows-x86_64.exe
          curl -fL --retry 3 -o bgutil-pot.exe https://github.com/jim60105/bgutil-ytdlp-pot-provider-rs/releases/download/v0.8.1/bgutil-pot-windows-x86_64.exe

          ./yt-dlp.exe --version
          ./ffmpeg.exe -version | head -1
          ./ffprobe.exe -version | head -1
          ./qjs.exe --version
          ./bgutil-pot.exe --version

      - name: Prepare PO-token provider plugin
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/pot-plugin/bgutil
          cd src-tauri/pot-plugin/bgutil
          curl -fL --retry 3 -o plugin.zip https://github.com/jim60105/bgutil-ytdlp-pot-provider-rs/releases/download/v0.8.1/bgutil-ytdlp-pot-provider-rs.zip
          unzip -o plugin.zip
          rm -f plugin.zip
          test -d yt_dlp_plugins/extractor

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "YT Downloader ${{ github.ref_name }}"
          releaseBody: "Скачайте установщик для вашей ОС: `.dmg` (macOS, Apple Silicon), `.msi`/`.exe` (Windows), `.deb`/`.AppImage` (Linux)."
          releaseDraft: true
          prerelease: false

  release-linux:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential curl wget file libxdo-dev libssl-dev

      - name: Install frontend deps
        run: npm ci

      - name: Prepare bundled yt-dlp/ffmpeg/ffprobe/qjs/bgutil-pot
        run: |
          set -euo pipefail
          mkdir -p src-tauri/binaries
          cd src-tauri/binaries

          curl -fL --retry 3 -o yt-dlp https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux
          curl -fL --retry 3 -o ffmpeg.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          mkdir extracted && tar -xf ffmpeg.tar.xz -C extracted
          find extracted -name ffmpeg -type f -exec cp {} ./ffmpeg \;
          find extracted -name ffprobe -type f -exec cp {} ./ffprobe \;
          rm -rf extracted ffmpeg.tar.xz

          curl -fL --retry 3 -o qjs https://github.com/quickjs-ng/quickjs/releases/download/v0.16.2/qjs-linux-x86_64
          curl -fL --retry 3 -o bgutil-pot https://github.com/jim60105/bgutil-ytdlp-pot-provider-rs/releases/download/v0.8.1/bgutil-pot-linux-x86_64

          chmod +x yt-dlp ffmpeg ffprobe qjs bgutil-pot
          ./yt-dlp --version
          ./ffmpeg -version | head -1
          ./ffprobe -version | head -1
          ./qjs --version
          ./bgutil-pot --version

      - name: Prepare PO-token provider plugin
        run: |
          set -euo pipefail
          mkdir -p src-tauri/pot-plugin/bgutil
          cd src-tauri/pot-plugin/bgutil
          curl -fL --retry 3 -o plugin.zip https://github.com/jim60105/bgutil-ytdlp-pot-provider-rs/releases/download/v0.8.1/bgutil-ytdlp-pot-provider-rs.zip
          unzip -o plugin.zip
          rm -f plugin.zip
          test -d yt_dlp_plugins/extractor

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "YT Downloader ${{ github.ref_name }}"
          releaseBody: "Скачайте установщик для вашей ОС: `.dmg` (macOS, Apple Silicon), `.msi`/`.exe` (Windows), `.deb`/`.AppImage` (Linux)."
          releaseDraft: true
          prerelease: false
