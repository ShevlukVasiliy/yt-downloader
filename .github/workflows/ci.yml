name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            exe-suffix: ""
          - platform: windows-latest
            exe-suffix: ".exe"
          - platform: ubuntu-22.04
            exe-suffix: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential curl wget file libxdo-dev libssl-dev

      - name: Install frontend deps
        run: npm ci

      # tauri-build validates that bundle.resources paths exist even for a plain
      # `cargo check`/`test` — placeholders are enough here since CI never runs
      # the actual downloaded binaries, just compiles against their presence.
      - name: Placeholder bundled binaries
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          for f in yt-dlp ffmpeg ffprobe qjs bgutil-pot; do
            name="$f${{ matrix.exe-suffix }}"
            printf '#!/bin/sh\nexit 1\n' > "src-tauri/binaries/$name"
            chmod +x "src-tauri/binaries/$name"
          done

      - name: Type-check frontend
        run: npx tsc --noEmit

      - name: Build frontend
        run: npm run build

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check --all-targets

      - name: Cargo test
        working-directory: src-tauri
        run: cargo test
