name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      # tauri-build validates that bundle.resources paths exist even for a plain
      # `cargo check`/`test` — placeholders are enough here since CI never runs
      # the actual downloaded binaries, just compiles against their presence.
      - name: Placeholder bundled binaries
        run: |
          mkdir -p src-tauri/binaries
          for f in yt-dlp ffmpeg ffprobe; do
            printf '#!/bin/sh\nexit 1\n' > "src-tauri/binaries/$f"
            chmod +x "src-tauri/binaries/$f"
          done

      - name: Type-check frontend
        run: npx tsc --noEmit

      - name: Build frontend
        run: npm run build

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check --all-targets

      - name: Cargo test
        working-directory: src-tauri
        run: cargo test
